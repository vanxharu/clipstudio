# Tự build bộ cài Windows (.exe) và phát hành để app tự cập nhật.
#
# Cách phát hành (chọn một):
#  1. Tăng "version" trong package.json (vd 1.0.0 -> 1.0.1) rồi đẩy lên nhánh main
#     -> tự build + tạo Release v1.0.1 -> mọi app đã cài tự cập nhật.
#  2. GitHub > Actions > "Build Windows app" > Run workflow > nhập phiên bản (vd 1.0.1) > Run.
#     Để trống ô phiên bản = chỉ build thử, tải .exe ở mục Artifacts (không phát hành).
#  3. Đẩy tag git dạng v1.0.1.
name: Build Windows app

on:
  push:
    branches: [main]
    paths: ['package.json']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Phiên bản phát hành (vd 1.0.1). Để trống = chỉ build thử, không phát hành'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Xác định phiên bản
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          MODE=test; V=""
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF_NAME#v}"; MODE=release
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && -n "$INPUT_VERSION" ]]; then V="${INPUT_VERSION#v}"; MODE=release
          elif [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            V=$(node -p "require('./package.json').version")
            CODE=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/v$V")
            if [[ "$CODE" == "200" ]]; then echo "Release v$V đã có, bỏ qua."; MODE=skip; else MODE=release; fi
          fi
          if [[ "$MODE" == "release" && ! "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Phiên bản phải có dạng 1.2.3 (nhận được: $V)"; exit 1
          fi
          echo "MODE=$MODE" >> "$GITHUB_ENV"
          echo "VERSION=$V" >> "$GITHUB_ENV"
          echo "Chế độ: $MODE  Phiên bản: ${V:-(giữ nguyên)}"

      - name: Đặt số phiên bản
        if: env.MODE == 'release'
        run: npm version "${{ env.VERSION }}" --no-git-tag-version --allow-same-version

      - name: Cài thư viện
        if: env.MODE != 'skip'
        run: npm install --no-audit --no-fund

      - name: Tải Piper (giọng đọc offline, MIT)
        if: env.MODE != 'skip'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/rhasspy/piper/releases/download/2023.11.14-2/piper_windows_amd64.zip" -OutFile piper.zip
          Expand-Archive piper.zip -DestinationPath pp-tmp
          $exe = Get-ChildItem pp-tmp -Recurse -Filter piper.exe | Select-Object -First 1
          if (-not $exe) { throw "Không thấy piper.exe" }
          New-Item -ItemType Directory -Force vendor | Out-Null
          Move-Item $exe.DirectoryName vendor/piper
          Get-ChildItem vendor/piper | Select-Object -First 20 | ForEach-Object { $_.Name }

      - name: Ghép web app
        if: env.MODE != 'skip'
        run: node build.js

      - name: Build & phát hành
        if: env.MODE == 'release'
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build thử (không phát hành)
        if: env.MODE == 'test'
        run: npx electron-builder --win --publish never

      - uses: actions/upload-artifact@v4
        if: env.MODE != 'skip'
        with:
          name: HTML-Video-Studio-Windows
          path: |
            dist/*.exe
            dist/latest.yml
          if-no-files-found: error
