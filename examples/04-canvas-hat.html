<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="h2v" content="width=1080,height=1080,fps=60,duration=8">
<title>Canvas hạt</title>
<style>html, body { margin: 0; height: 100%; overflow: hidden; background: #000; } canvas { display: block; width: 100%; height: 100%; }</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
  const c = document.getElementById('c'), x = c.getContext('2d');
  const W = c.width = innerWidth, H = c.height = innerHeight;
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647; // ngẫu nhiên có seed -> video lặp lại được
  const P = Array.from({ length: 500 }, () => ({ a: rnd() * Math.PI * 2, r: 60 + rnd() * W * 0.45, s: 0.2 + rnd() * 0.8, z: 1 + rnd() * 3, h: 180 + rnd() * 140 }));
  const t0 = performance.now();
  function draw(now) {
    const t = (now - t0) / 1000;
    x.fillStyle = 'rgba(0,0,10,0.18)'; x.fillRect(0, 0, W, H);
    for (const p of P) {
      const a = p.a + t * p.s * 0.6, rr = p.r * (0.85 + 0.15 * Math.sin(t * 1.5 + p.a * 3));
      x.fillStyle = `hsl(${p.h + t * 20},90%,65%)`;
      x.beginPath(); x.arc(W / 2 + Math.cos(a) * rr, H / 2 + Math.sin(a) * rr * 0.9, p.z, 0, 7); x.fill();
    }
    x.fillStyle = '#fff'; x.font = `800 ${W * 0.09}px system-ui, sans-serif`; x.textAlign = 'center'; x.textBaseline = 'middle';
    x.globalAlpha = Math.min(1, t / 1.5); x.fillText('CANVAS', W / 2, H / 2); x.globalAlpha = 1;
    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
</script>
</body>
</html>
