<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="h2v" content="width=1080,height=1920,fps=30,duration=10">
<title>Video dọc 9:16</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@500;800&display=swap">
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
  body { font-family: 'Be Vietnam Pro', system-ui, sans-serif; background: linear-gradient(160deg, #fceabb, #f8b500); color: #1d1d1f; }
  .bar { position: absolute; top: 60px; left: 60px; right: 60px; height: 14px; border-radius: 7px; background: rgba(0,0,0,.12); overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: #1d1d1f; }
  h1 { position: absolute; top: 170px; left: 70px; right: 70px; font-size: 104px; line-height: 1.05; margin: 0; font-weight: 800; }
  .card { position: absolute; left: 70px; right: 70px; padding: 48px 56px; border-radius: 40px; background: #fff;
          box-shadow: 0 30px 60px rgba(0,0,0,.15); display: flex; gap: 36px; align-items: center; opacity: 0; }
  .card b { font-size: 120px; line-height: 1; color: #f8b500; font-weight: 800; }
  .card span { font-size: 54px; font-weight: 500; line-height: 1.2; }
  .cta { position: absolute; bottom: 150px; left: 0; right: 0; text-align: center; font-size: 60px; font-weight: 800; opacity: 0; }
</style>
</head>
<body>
  <div class="bar"><i id="prog"></i></div>
  <h1 id="title">3 mẹo học code nhanh hơn</h1>
  <div class="card" style="top:700px"><b>1</b><span>Làm dự án nhỏ mỗi ngày</span></div>
  <div class="card" style="top:1030px"><b>2</b><span>Đọc code của người khác</span></div>
  <div class="card" style="top:1360px"><b>3</b><span>Giải thích lại cho bạn bè</span></div>
  <div class="cta" id="cta">Lưu lại & theo dõi 👉</div>
<script>
  // Hoạt ảnh điều khiển bằng JS + requestAnimationFrame (tool sẽ đóng băng thời gian khi render)
  const DURATION = 10;
  const ease = t => 1 - Math.pow(1 - Math.min(Math.max(t, 0), 1), 3);
  const cards = [...document.querySelectorAll('.card')];
  const title = document.getElementById('title'), cta = document.getElementById('cta'), prog = document.getElementById('prog');
  const start = performance.now();
  function frame(now) {
    const t = (now - start) / 1000;
    prog.style.width = Math.min(100, t / DURATION * 100) + '%';
    const k = ease(t / 0.8);
    title.style.opacity = k; title.style.transform = `translateY(${(1 - k) * 60}px)`;
    cards.forEach((c, i) => {
      const p = ease((t - 1.2 - i * 1.6) / 0.6);
      c.style.opacity = p;
      c.style.transform = `translateX(${(1 - p) * (i % 2 ? 300 : -300)}px) scale(${0.9 + 0.1 * p})`;
    });
    const q = ease((t - 6.6) / 0.6);
    cta.style.opacity = q; cta.style.transform = `scale(${0.8 + 0.2 * q + Math.sin(t * 6) * 0.02 * q})`;
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
</script>
</body>
</html>
