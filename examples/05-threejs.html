<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="h2v" content="width=1920,height=1080,fps=30,duration=8">
<title>Three.js 3D</title>
<style>html, body { margin: 0; height: 100%; overflow: hidden; background: #111; } canvas { display: block; }</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
<script>
  const W = innerWidth, H = innerHeight;
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(W, H); renderer.setPixelRatio(1);
  document.body.appendChild(renderer.domElement);
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x111122);
  const cam = new THREE.PerspectiveCamera(45, W / H, 0.1, 100); cam.position.set(0, 0, 9);
  const mesh = new THREE.Mesh(new THREE.TorusKnotGeometry(1.8, 0.55, 220, 32),
    new THREE.MeshStandardMaterial({ color: 0xff6b6b, metalness: 0.35, roughness: 0.25 }));
  scene.add(mesh);
  scene.add(new THREE.AmbientLight(0x404060, 1.2));
  const l1 = new THREE.PointLight(0x66ccff, 2, 30); l1.position.set(5, 4, 6); scene.add(l1);
  const l2 = new THREE.PointLight(0xffcc66, 1.5, 30); l2.position.set(-6, -3, 4); scene.add(l2);
  const clock = new THREE.Clock(); // dùng performance.now -> tool điều khiển được
  function loop() {
    const t = clock.getElapsedTime();
    mesh.rotation.x = t * 0.5; mesh.rotation.y = t * 0.8;
    mesh.scale.setScalar(Math.min(1, t / 1.2));
    renderer.render(scene, cam);
    requestAnimationFrame(loop);
  }
  loop();
</script>
</body>
</html>
