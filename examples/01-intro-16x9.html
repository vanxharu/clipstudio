<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="h2v" content="width=1920,height=1080,fps=30,duration=6">
<title>Intro motion graphics</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;800&display=swap">
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
  body {
    font-family: 'Be Vietnam Pro', system-ui, sans-serif;
    background: radial-gradient(circle at 30% 30%, #2b1055, #0b0b1a 70%);
    color: #fff; display: grid; place-items: center;
  }
  .ring { position: absolute; border-radius: 50%; border: 3px solid rgba(255,255,255,.15); animation: spin 8s linear infinite; }
  .ring.a { width: 900px; height: 900px; border-top-color: #ff5f6d; }
  .ring.b { width: 650px; height: 650px; border-right-color: #ffc371; animation-duration: 5s; animation-direction: reverse; }
  .dot { position: absolute; width: 22px; height: 22px; border-radius: 50%; background: #ffc371; animation: float 3s ease-in-out infinite alternate; }
  .wrap { position: relative; text-align: center; }
  h1 { font-size: 150px; font-weight: 800; margin: 0; letter-spacing: -3px; }
  h1 span { display: inline-block; opacity: 0; transform: translateY(80px) rotate(8deg); animation: up .7s cubic-bezier(.2,.8,.2,1.2) forwards; }
  .line { height: 8px; width: 0; margin: 24px auto; border-radius: 4px; background: linear-gradient(90deg, #ff5f6d, #ffc371); animation: grow 1s 1.6s ease-out forwards; }
  p { font-size: 44px; margin: 0; opacity: 0; animation: fade 1s 2.2s forwards; color: #ddd; }
  .out { animation: out .8s 5s ease-in forwards; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes float { from { transform: translate(-500px, -300px); } to { transform: translate(-460px, -240px); } }
  @keyframes up { to { opacity: 1; transform: none; } }
  @keyframes grow { to { width: 520px; } }
  @keyframes fade { to { opacity: 1; } }
  @keyframes out { to { opacity: 0; transform: scale(1.15); filter: blur(10px); } }
</style>
</head>
<body>
  <div class="ring a"></div><div class="ring b"></div><div class="dot"></div>
  <div class="wrap out">
    <h1 id="title">Xin chào!</h1>
    <div class="line"></div>
    <p>Video này được tạo từ HTML, CSS và JS</p>
  </div>
<script>
  const h = document.getElementById('title');
  h.innerHTML = [...h.textContent].map((c, i) =>
    `<span style="animation-delay:${0.2 + i * 0.08}s">${c === ' ' ? '&nbsp;' : c}</span>`).join('');
</script>
</body>
</html>
